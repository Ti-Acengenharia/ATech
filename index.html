<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f3b99" />
  <meta name="description" content="Gestão de assistência técnica e operações ATech" />
  <link rel="icon" type="image/png" href="/logo-ac.png" />
  <link rel="apple-touch-icon" href="/logo-ac.png" />
  <title>ATech | Assistência Técnica</title>
</head>

<body>
  <div id="root">
    <div id="app-preloader" style="
      position: fixed; inset: 0; min-height: 100vh; min-height: 100svh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 25%, #eff6ff 0%, #f8fafc 55%, #eef2f6 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      text-align: center; padding: 24px; z-index: 9999; box-sizing: border-box;
    ">
      <style>
        @keyframes pre-halo { 0% { transform: scale(0.9); opacity: .6; } 100% { transform: scale(1.15); opacity: 1; } }
        @keyframes pre-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        @keyframes pre-slide { 0% { left: -45%; } 100% { left: 105%; } }
        @keyframes pre-pulse { 0% { opacity: .7; } 100% { opacity: 1; } }
      </style>
      <div style="
        position: relative; display: flex; flex-direction: column; align-items: center;
        padding: 36px 44px; background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(226, 232, 240, 0.9); border-radius: 24px;
        box-shadow: 0 20px 45px -12px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(15, 59, 153, 0.04);
        max-width: 420px; width: 100%; box-sizing: border-box;
      ">
        <div style="
          position: absolute; top: 36px; width: 110px; height: 110px;
          background: radial-gradient(circle, rgba(56, 189, 248, 0.3) 0%, rgba(15, 59, 153, 0.12) 50%, transparent 70%);
          border-radius: 50%; pointer-events: none; animation: pre-halo 2.4s ease-in-out infinite alternate;
        "></div>
        <div style="
          position: relative; width: 68px; height: 68px; border-radius: 18px;
          background: #ffffff; border: 1px solid rgba(226, 232, 240, 0.95);
          box-shadow: 0 10px 24px -6px rgba(15, 59, 153, 0.14), 0 2px 6px rgba(15, 23, 42, 0.06);
          display: flex; align-items: center; justify-content: center;
          padding: 10px; margin-bottom: 16px; animation: pre-float 2.8s ease-in-out infinite; box-sizing: border-box;
        ">
          <img src="/logo-ac.png" alt="AC Engenharia" style="width: 100%; height: 100%; object-fit: contain; display: block;" />
        </div>
        <div style="
          display: inline-flex; align-items: baseline; font-size: 26px; font-weight: 800;
          letter-spacing: -0.035em; color: #0b2968; line-height: 1; margin: 0 0 16px;
        ">
          ATech<span style="color: #0284c7; animation: pre-pulse 1.4s ease-in-out infinite alternate;">.</span>
        </div>
        <div style="
          width: 160px; height: 4px; background: #e2e8f0; border-radius: 999px;
          overflow: hidden; position: relative; margin-bottom: 16px;
        ">
          <div style="
            position: absolute; top: 0; bottom: 0; width: 45%;
            background: linear-gradient(90deg, #0f3b99 0%, #0284c7 60%, #38bdf8 100%);
            border-radius: 999px; box-shadow: 0 0 8px rgba(56, 189, 248, 0.55);
            animation: pre-slide 1.35s cubic-bezier(0.4, 0, 0.2, 1) infinite;
          "></div>
        </div>
        <p style="font-size: 13.5px; font-weight: 600; color: #334155; margin: 0 0 4px; letter-spacing: -0.01em;">Carregando informações...</p>
        <p style="font-size: 11px; font-weight: 500; color: #94a3b8; margin: 0; letter-spacing: 0.02em; text-transform: uppercase;">AC Engenharia · ATech</p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
